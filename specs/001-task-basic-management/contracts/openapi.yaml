openapi: 3.1.0
info:
  title: タスク基本管理 API
  version: 0.1.0
  description: userId 単位でタスクを登録、一覧、詳細確認、更新、論理削除する backend REST API。日時の API 表現は JST (Asia/Tokyo, UTC+09:00) の ISO-8601 オフセット付き文字列とする。
servers:
  - url: http://localhost:8080
paths:
  /users/{userId}/tasks:
    get:
      summary: 指定 userId の未削除タスク一覧を取得する
      operationId: listTasks
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 未削除タスク一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: 指定 userId のタスクを登録する
      operationId: createTask
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
            examples:
              valid:
                value:
                  title: 買い物メモを作る
                  description: 週末までに必要なものを整理する
                  status: TODO
      responses:
        "201":
          description: 登録済みタスク
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/{userId}/tasks/{taskId}:
    get:
      summary: 指定 userId の未削除タスク詳細を取得する
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: タスク詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: 指定 userId の未削除タスクを更新する
      operationId: updateTask
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdateRequest"
            examples:
              valid:
                value:
                  title: 買い物メモを更新する
                  description: 予算も追記する
                  status: DOING
      responses:
        "200":
          description: 更新済みタスク
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: 指定 userId の未削除タスクを論理削除する
      operationId: deleteTask
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: 論理削除成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: 外部から与えられるユーザー識別子。実装では `@NotBlank` 相当として空文字・空白のみを拒否する。
      schema:
        type: string
        minLength: 1
        pattern: "\\S"
    TaskId:
      name: taskId
      in: path
      required: true
      description: DB 採番のタスク識別子。
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    TaskStatus:
      type: string
      enum:
        - TODO
        - DOING
        - DONE
    TaskCreateRequest:
      type: object
      required:
        - title
        - status
      properties:
        title:
          type: string
          description: 実装では `@NotBlank` 相当として空文字・空白のみを拒否する。
          minLength: 1
          pattern: "\\S"
        description:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/TaskStatus"
      additionalProperties: false
    TaskUpdateRequest:
      type: object
      required:
        - title
        - status
      properties:
        title:
          type: string
          description: 実装では `@NotBlank` 相当として空文字・空白のみを拒否する。
          minLength: 1
          pattern: "\\S"
        description:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/TaskStatus"
      additionalProperties: false
    TaskResponse:
      type: object
      required:
        - id
        - userId
        - title
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: string
        title:
          type: string
        description:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/TaskStatus"
        createdAt:
          type: string
          format: date-time
          description: JST (Asia/Tokyo, UTC+09:00) の ISO-8601 オフセット付き作成時点。
          example: "2026-05-09T10:30:00+09:00"
        updatedAt:
          type: string
          format: date-time
          description: JST (Asia/Tokyo, UTC+09:00) の ISO-8601 オフセット付き更新時点。
          example: "2026-05-09T10:35:00+09:00"
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP ステータスコード。アプリケーション独自コードではない。
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
      additionalProperties: false
    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type: string
        message:
          type: string
      additionalProperties: false
  responses:
    BadRequest:
      description: 入力値が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 400
            message: 入力値が不正です
            details:
              - field: status
                message: TODO, DOING, DONE のいずれかを指定してください
    NotFound:
      description: タスクが存在しない、別 userId に属する、または論理削除済み
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 404
            message: タスクが見つかりません
    InternalServerError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 500
            message: サーバー内部エラーが発生しました
